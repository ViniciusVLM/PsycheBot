<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsycheBot | IA de Carreira</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>PsycheBot 🤖</h1>
        <p>Análise de perfil para o Jovem Trabalhador</p>
    </header>

    <main>
        <form method="POST">
            <div class="campo">
                <label>Como você lida com situações de pressão ou prazos curtos?</label>
                <textarea name="p1" required placeholder="Sua resposta..."></textarea>
            </div>

            <div class="campo">
                <label>O que você considera mais importante para um bom trabalho em equipe?</label>
                <textarea name="p2" required placeholder="Sua resposta..."></textarea>
            </div>

            <button type="submit">Gerar Parecer Profissional</button>
        </form>

        {% if resultado %}
            <section class="resultado-container">
                <h2>Parecer do Especialista</h2>
                <div class="texto-ia">
                    {{ resultado | safe }}
                </div>
                <button onclick="window.location.href='/'" class="btn-novo">Nova Consulta</button>
            </section>
        {% endif %}
    </main>

    <footer>
        <p>&copy; 2026 Gincana Dia do Jovem Trabalhador - CIEE</p>
    </footer>

</body>
</html>
